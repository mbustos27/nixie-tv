version = 1
# Nixie: this repository is Nixie for TV, based on Glacier (https://github.com/Glacier-Jellyfin/glacier-androidtv).
SPDX-PackageName = "Nixie for TV"
SPDX-PackageDownloadLocation = "https://github.com/mbustos27/nixie-tv"

# Everything that is not listed below is Glacier's own work.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Glacier contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Media3's decoder_ffmpeg module, vendored (see core/ffmpeg/README.md).
# FFmpeg itself is downloaded at build time and is not part of this repository.
[[annotations]]
path = ["core/ffmpeg/src/main/java/**", "core/ffmpeg/src/main/jni/CMakeLists.txt", "core/ffmpeg/src/main/jni/ffmpeg_jni.cc"]
precedence = "override"
SPDX-FileCopyrightText = "The Android Open Source Project"
SPDX-License-Identifier = "Apache-2.0"

# Gradle wrapper.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle authors"
SPDX-License-Identifier = "Apache-2.0"

# Fonts and their licence texts.
[[annotations]]
path = ["core/designsystem/src/main/res/font/google_sans.ttf", "core/designsystem/src/main/assets/licenses/google-sans-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2025 The Google Sans Project Authors (https://github.com/googlefonts/googlesans)"
SPDX-License-Identifier = "OFL-1.1"

# Language flags (flag-icon-css, see the LICENSE next to them).
[[annotations]]
path = "app/src/main/assets/flags/**"
precedence = "override"
SPDX-FileCopyrightText = "2013 Panayiotis Lipiridis"
SPDX-License-Identifier = "MIT"

# Dolby Vision RPUs from dovi_tool's test assets and what dovi_tool made of them.
[[annotations]]
path = "core/player/src/test/resources/dolby-vision/*.bin"
precedence = "override"
SPDX-FileCopyrightText = "quietvoid"
SPDX-License-Identifier = "MIT"

# Our test pattern, with a dovi_tool RPU in every frame.
[[annotations]]
path = "core/player/src/test/resources/dolby-vision/*.hevc"
precedence = "override"
SPDX-FileCopyrightText = ["Glacier contributors", "quietvoid"]
SPDX-License-Identifier = "GPL-3.0-or-later AND MIT"

# Nixie: Nixie for TV's own files (the fork's changes inside Glacier's files carry both lines through the first entry).
[[annotations]]
path = [
    "core/designsystem/src/main/java/io/github/mbustos27/**",
    "theme/**",
    "app/src/main/java/io/github/mbustos27/**",
    "app/src/test/java/io/github/mbustos27/**",
    "app/src/main/res/values*/nixie_strings.xml",
    "app/src/nixie/**",
    "tools/release-check/**",
    "testing/**",
    "baselineprofile/**",
    "gate/**",
    "tools/gate/**",
    "docs/PHASE0-OWNER.md",
    "docs/THEMES.md",
    "docs/GLACIER-BASE.md",
    "DIVERGENCE.md",
    ".github/ISSUE_TEMPLATE/bug.yml",
    ".github/ISSUE_TEMPLATE/feature.yml",
    "PRIVACY.md",
    "docs/PUBLISH-CHECKLIST.md",
    "docs/brand/README.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Nixie contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Nixie: files that began as copies of Glacier's and were changed for Nixie keep Glacier's copyright beside Nixie's
# (after the entry above, so this one decides for them): the rebrand's strings (Glacier's strings, renamed and
# translated), the theme modules' screen stand-ins (copied from the app's layout around each hook), and the public
# repository's pages rewritten for Nixie in place of Glacier's.
[[annotations]]
path = [
    "app/src/nixie/res/values*/strings.xml",
    "theme/*/src/test/java/io/github/mbustos27/nixie/tv/theme/*/StandIns.kt",
    "README.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "CHANGELOG.de.md",
    "CHANGELOG.es.md",
    "scripts/README.md",
    ".github/PULL_REQUEST_TEMPLATE.md",
    ".github/ISSUE_TEMPLATE/config.yml",
]
precedence = "override"
SPDX-FileCopyrightText = ["Glacier contributors", "2026 Nixie contributors"]
SPDX-License-Identifier = "GPL-3.0-or-later"

# Nixie: the brand art (docs/brand/README.md), Nixie's own drawing with the NIXIE letters as Monoton's outlines.
# Monoton is by Vernon Adams under the SIL Open Font License 1.1; the font itself is not in this repository.
[[annotations]]
path = ["docs/brand/*.svg", "docs/brand/*.png"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Nixie contributors", "2011 Vernon Adams"]
SPDX-License-Identifier = "GPL-3.0-or-later AND OFL-1.1"
