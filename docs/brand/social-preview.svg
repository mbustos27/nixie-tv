<title id="t">Nixie for TV: a Jellyfin app for Android TV and Google TV</title>
<!-- Nixie for TV's social preview. The dusk scene, the glass card and the NIXIE wordmark (Monoton, SIL OFL 1.1, as
     outlines) are Nixie for Windows' brand art (github.com/mbustos27/nixie, docs/brand); the "TV" badge and the TV set
     are the TV banners'. Notes: docs/brand/README.md. -->
