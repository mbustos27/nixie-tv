<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t">
<title id="t">Nixie for TV: a Jellyfin app for Android TV and Google TV, built for the remote</title>
<!-- Nixie's light banner. The dusk scene follows ui/FluentFin.Core/Theming/DuskScene.cs and the hills
     ui/FluentFin/Controls/AmbientBackdropView.xaml; the wordmark is Monoton (SIL OFL 1.1) as outlines, lit as
     ui/FluentFin/Controls/AppWordmark.cs lights it. Notes: docs/brand/README.md. -->
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0.000" stop-color="#FFF4EE"/><stop offset="0.420" stop-color="#F9C9BF"/><stop offset="0.560" stop-color="#F5A8A5"/><stop offset="0.670" stop-color="#F7AA9C"/><stop offset="0.765" stop-color="#F38C7D"/><stop offset="1.000" stop-color="#EC6A79"/></linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4EE"/><stop offset="1" stop-color="#EC6A79"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/><stop offset="0.35" stop-color="#000000" stop-opacity="0.18"/><stop offset="1" stop-color="#000000" stop-opacity="0.12"/></linearGradient>
<linearGradient id="lit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/><stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.15"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#500723" stop-opacity="0"/><stop offset="1" stop-color="#500723" stop-opacity="0.1"/></radialGradient>

